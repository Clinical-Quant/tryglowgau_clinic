<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Take a complimentary aesthetic mapping assessment — a private, browser-based scan that helps our team understand your skin and prepare for your consultation.">
    <title>Aesthetic Mapping Assessment · Aurum Aesthetics Demo Clinic</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap">
    <link rel="stylesheet" href="../styles.css">

    <!-- BEGIN GLOWGAU WIDGET -->
    <!--
      Glowgau AI clinic assistant — floating widget.
      Loaded as a single <script> tag in <head>. The widget auto-derives its
      brand color, label, and enabled modules from
      https://glowgau.com/api/public/portal-config/aurum-aesthetics

      Slug: aurum-aesthetics
      Snippet source: https://glowgau.com/widget.js (provided by COO/CTO profile)
      Authoritative config endpoint: /api/public/portal-config/<slug>
    -->
    <script src="https://glowgau.com/widget.js" data-clinic="aurum-aesthetics" async></script>
    <!-- END GLOWGAU WIDGET -->

    <style>
        /* ----------------------------------------------------------------
           Consultation / Embed page — full-screen, no-scroll, no chrome
           ----------------------------------------------------------------- */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0B0B0F;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .embed-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .embed-frame {
            flex: 1;
            width: 100%;
            border: 0;
            display: block;
            background: #FFFFFF;
        }
        .embed-bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #0B0B0F;
            color: #E8E8EC;
            font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .embed-bar__brand {
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.02em;
        }
        .embed-bar__brand-mark {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: #C9A96E;
            box-shadow: 0 0 0 2px rgba(201,169,110,0.18);
        }
        .embed-bar__brand strong {
            font-weight: 600;
            color: #FFFFFF;
        }
        .embed-bar__brand span {
            color: #9B9BA8;
        }
        .embed-bar__actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .embed-bar__link {
            color: #C9A96E;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid rgba(201,169,110,0.35);
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .embed-bar__link:hover,
        .embed-bar__link:focus-visible {
            background: rgba(201,169,110,0.10);
            border-color: rgba(201,169,110,0.65);
        }
        .embed-bar__link--ghost {
            color: #9B9BA8;
            border-color: rgba(255,255,255,0.10);
        }
        .embed-bar__link--ghost:hover,
        .embed-bar__link--ghost:focus-visible {
            background: rgba(255,255,255,0.04);
            color: #FFFFFF;
            border-color: rgba(255,255,255,0.20);
        }

        /* Persistent header demo pill (still required since this is a demo site) */
        .demo-pill {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(11,11,15,0.85);
            color: #E8E8EC;
            font: 600 11px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 6px 10px;
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(6px);
            pointer-events: none;
        }
        .demo-pill::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 9999px;
            background: #C9A96E;
        }

        @media (max-width: 640px) {
            .embed-bar {
                padding: 8px 12px;
                font-size: 12px;
            }
            .embed-bar__link {
                padding: 5px 10px;
            }
            .embed-bar__brand-mark {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- Demo signal pill (consistent with other pages; URL is apex, no demo subdomain) -->
<span class="demo-pill" aria-label="Demo clinic website">Demo Clinic</span>

<!-- Full-screen consultation / embed -->
<main class="embed-shell" id="main">

    <iframe
        class="embed-frame"
        src="https://glowgau.com/demo/aurum-aesthetics"
        title="Aesthetic Mapping Assessment — Aurum Aesthetics"
        loading="lazy"
        allow="camera"
        allowfullscreen></iframe>

    <div class="embed-bar" role="contentinfo">
        <div class="embed-bar__brand">
            <span class="embed-bar__brand-mark" aria-hidden="true"></span>
            <strong>Aurum Aesthetics</strong>
            <span>· Aesthetic Mapping Assessment</span>
        </div>
        <div class="embed-bar__actions">
            <a class="embed-bar__link embed-bar__link--ghost" href="../index.html">Back to Aurum</a>
            <a class="embed-bar__link" href="../contact.html">Standard booking form</a>
        </div>
    </div>

</main>

</body>
</html>
